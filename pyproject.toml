[project]
name = "release-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ranjith Kumar R G", email = "theranjith@gmail.com" }
]
requires-python = "==3.14.*"
dependencies = [
    "alembic>=1.19.1",
    "fastapi[standard]>=0.115.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.39",
]

[tool.fastapi]
entrypoint = "release_tracker.main:app" 

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]